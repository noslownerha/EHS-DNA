    <title>EHS DNA</title>
    <meta name="description" content="Report incidents, run inspections, and complete safety training from the floor." />

    <!-- iOS add-to-homescreen (Safari ignores the manifest for these) -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EHS DNA" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
