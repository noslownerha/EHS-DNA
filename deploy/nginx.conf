# EHS DNA nginx config — LIVE, post-certbot.
#
# This mirrors what is actually running on GizmoDuck at
#   /etc/nginx/sites-enabled/ehsdna
# It already contains the Certbot-managed TLS blocks, so DO NOT run certbot
# against a fresh copy of this file expecting it to add them again.
#
# Install (first time only):
#   cp deploy/nginx.conf /etc/nginx/sites-available/ehsdna
#   ln -s /etc/nginx/sites-available/ehsdna /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# DNS: A records for ehsdna.com, www.ehsdna.com, app.ehsdna.com -> 91.98.233.204
# TLS was originally issued with:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d ehsdna.com -d www.ehsdna.com -d app.ehsdna.com
# Certbot auto-renews; the "managed by Certbot" lines below are its output.
#
# If you edit this file, apply it with:  nginx -t && systemctl reload nginx
# Keep this file and the live config in sync — the live box is the source of truth.

# ── Marketing site: ehsdna.com ────────────────────────────────────────────────
server {
    server_name ehsdna.com www.ehsdna.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # NB: no X-Frame-Options here — the marketing page may want to be embeddable.

    root /home/ehs-platform/marketing;
    index index.html;

    # Lead-capture form posts to the app's API
    location /api/leads {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # "Sign in" button target
    location /app {
        return 302 https://app.ehsdna.com$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ehsdna.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ehsdna.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── Application: app.ehsdna.com ───────────────────────────────────────────────
server {
    server_name app.ehsdna.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Must be >= the Express json limit (15mb in server/index.cjs) or nginx 413s
    # photo uploads before the app can return its friendly "too large" message.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REQUIRED: the login rate limiter reads X-Forwarded-For. Without it every
        # request looks like 127.0.0.1 and one user's failed logins lock out everyone.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ehsdna.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ehsdna.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTP -> HTTPS redirects (Certbot-generated) ───────────────────────────────
server {
    if ($host = www.ehsdna.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ehsdna.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ehsdna.com www.ehsdna.com;
    return 404; # managed by Certbot
}

server {
    if ($host = app.ehsdna.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.ehsdna.com;
    client_max_body_size 15m;
    return 404; # managed by Certbot
}
