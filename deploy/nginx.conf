# EHS DNA nginx config
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/ehsdna
#          ln -s /etc/nginx/sites-available/ehsdna /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# DNS: A records for ehsdna.com, www.ehsdna.com, app.ehsdna.com → 91.98.233.204
# TLS: apt install certbot python3-certbot-nginx
#      certbot --nginx -d ehsdna.com -d www.ehsdna.com -d app.ehsdna.com

# ── Marketing site: ehsdna.com ────────────────────────────────────────────────
server {
    listen 80;
    server_name ehsdna.com www.ehsdna.com;

    root /home/ehs-platform/marketing;
    index index.html;

    # Lead-capture form posts to the app's API
    location /api/leads {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # "Sign in" button target
    location /app {
        return 302 https://app.ehsdna.com$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Application: app.ehsdna.com ───────────────────────────────────────────────
server {
    listen 80;
    server_name app.ehsdna.com;

    # Must be >= the Express json limit (15mb) or nginx 413s photo uploads
    # before the app can return its friendly "upload too large" message.
    client_max_body_size 16m;

    # Security headers. HSTS only takes effect once certbot adds TLS (it is
    # ignored over plain HTTP), so it is safe to declare here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                 # no clickjacking of the console
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
