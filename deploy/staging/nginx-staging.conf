# staging.ehsdna.com → the staging copy on :3002, behind a password prompt.
# setup-staging.sh installs this, then certbot adds HTTPS to it.
server {
    listen 80;
    server_name staging.ehsdna.com;

    # Never public, never indexed.
    auth_basic "EHS DNA staging";
    auth_basic_user_file /etc/nginx/ehsdna-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 64m;   # PowerPoint imports

    # The app authenticates API calls with its own "Authorization: Bearer" header,
    # which collides with the Basic-auth prompt's header: every API call overwrote
    # the prompt's credentials, nginx returned 401, and the browser re-prompted in
    # a loop. /api/ is protected by the app's own sign-in (same as production), so
    # the prompt only guards the site itself.
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # course drafting can take up to a minute
    }
}
